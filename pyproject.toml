[project]
name = "stata-cli"
version = "0.5.2"
description = "Agent-native Stata CLI for AI coding agents and empirical research"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = [
    "stata",
    "pystata",
    "ai-agent",
    "agent-tools",
    "agent-skills",
    "codex",
    "claude-code",
    "cursor",
    "econometrics",
    "empirical-research",
    "causal-inference",
    "data-analysis",
    "data-science",
    "statistics",
    "cli",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://ashuigordon.github.io/stata-cli/"
Documentation = "https://github.com/ashuiGordon/stata-cli#readme"
Repository = "https://github.com/ashuiGordon/stata-cli"
Issues = "https://github.com/ashuiGordon/stata-cli/issues"
Changelog = "https://github.com/ashuiGordon/stata-cli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
data = ["numpy", "pandas"]

[project.scripts]
stata-cli = "stata_cli.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stata_cli = ["skills/**/*.md"]
